<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>糯米驱邪有限公司</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* 港产僵尸片的夜：青黑夜色、符纸黄、朱砂红、糯米白、尸青。
     版式：一屏的手机 App。上栏是章节、地点和两项数值，中间是点一下出一句的对话流，下栏是操作。 */
  --night: #0d2a2e;
  --night-2: #13383d;
  --night-3: #1b474d;
  --rice: #f1ecdf;
  --rice-dim: #a9bcb7;
  --fu: #e8bf3a;
  --zhusha: #c4321c;
  --shiqing: #93b29c;
  --paper: #efe3c4;
  --ink: #2b1a0e;
  --font-brush: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", serif;
  --font-body: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-ui: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --bgA: #0d2a2e;
  --bgB: #18414a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--rice); font-family: var(--font-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--fu); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- app shell */
#app { height: 100%; max-width: 560px; margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bgA); position: relative; overflow: hidden; }
#app[data-bg="home"]   { --bgA: #102528; --bgB: #22403b; }
#app[data-bg="flash"]  { --bgA: #221f16; --bgB: #3b3322; }
#app[data-bg="mount"]  { --bgA: #0a2124; --bgB: #173b3a; }
#app[data-bg="hosp"]   { --bgA: #0f262c; --bgB: #244a52; }
#app[data-bg="garage"] { --bgA: #172225; --bgB: #2b3a3a; }
#app[data-bg="office"] { --bgA: #13272a; --bgB: #253f3c; }
#app[data-bg="dawn"]   { --bgA: #122437; --bgB: #34405a; }
#app[data-bg="tomb"]   { --bgA: #081b18; --bgB: #123229; }
#app[data-bg="gold"]   { --bgA: #17140a; --bgB: #4a3a12; }
#app[data-bg="police"] { --bgA: #0d1f31; --bgB: #1d3a58; }
#app[data-bg="store"]  { --bgA: #132826; --bgB: #2c4a41; }

.top { position: relative; z-index: 2; display: grid; gap: 6px; padding: 10px 16px 0; background: var(--night); border-bottom: 1px solid rgba(241,236,223,.1); }
.row1 { display: flex; align-items: center; gap: 10px; }
.chap { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.chap span { font-family: var(--font-ui); font-size: 12px; color: var(--fu); white-space: nowrap; }
.chap b { font-family: var(--font-brush); font-weight: 400; font-size: 22px; white-space: nowrap; }
.place { margin-left: auto; display: grid; text-align: right; font-family: var(--font-ui); font-size: 12px; line-height: 1.35; color: var(--rice-dim); }
.place #place { color: var(--rice); font-weight: 600; }
.icon { flex: none; background: transparent; border: 1px solid rgba(241,236,223,.25); border-radius: 8px; padding: 6px 10px; font-family: var(--font-ui); font-size: 13px; }
.hud { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; min-height: 22px; padding-bottom: 9px; font-family: var(--font-ui); font-size: 12px; }
.stat { position: relative; display: flex; align-items: center; gap: 6px; }
.stat[hidden] { display: none; }
.stat .lbl { color: var(--rice-dim); }
.bar { width: 72px; height: 6px; border-radius: 3px; background: rgba(241,236,223,.15); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--rice); transition: width .6s; }
.stat.low .bar i { background: var(--zhusha); }
.stat b { font-weight: 600; font-variant-numeric: tabular-nums; }
#hbNum { color: #ff9b85; }
#hbNum.ok { color: var(--shiqing); }
.delta { position: absolute; left: 0; top: 100%; margin-top: 2px; white-space: nowrap; font-weight: 600; color: #ff9b85; pointer-events: none; animation: rise 1.7s ease-out forwards; z-index: 3; }
.delta.up { color: var(--shiqing); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-12px); } }
.prog { position: absolute; left: -16px; right: -16px; bottom: -1px; height: 2px; }
.prog i { display: block; height: 100%; width: 0; background: var(--fu); transition: width .3s; }

.feed { min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 12px; padding: 20px 16px 48px; background: radial-gradient(140% 60% at 50% 0%, var(--bgB), var(--bgA) 70%); cursor: pointer; }
#app.flash .feed { filter: sepia(.35); }
.feed > * { flex: none; animation: in .28s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.ctrl { display: flex; align-items: stretch; gap: 8px; padding: 10px 16px 12px; background: var(--night); border-top: 1px solid rgba(241,236,223,.1); }
.primary, .act-btn { background: var(--zhusha); color: #fff6ea; border: 0; border-radius: 10px; padding: 12px 18px; font-family: var(--font-ui); font-weight: 600; font-size: 15px; }
.primary.xl { font-size: 17px; padding: 14px 18px; }
.ghost { background: transparent; color: var(--rice); border: 1px solid rgba(241,236,223,.3); border-radius: 10px; padding: 11px 14px; font-family: var(--font-ui); font-size: 14px; }
.ghost[aria-pressed="true"] { background: var(--fu); color: var(--ink); border-color: var(--fu); }
.link { background: none; border: 0; padding: 6px; color: var(--fu); font-family: var(--font-ui); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
#nextBtn { flex: 1; display: grid; gap: 1px; line-height: 1.25; }
#nextBtn small { font-weight: 400; font-size: 11px; opacity: .8; }
#nextBtn:disabled { background: var(--night-3); color: var(--rice-dim); }
.act-btn:disabled { background: #46595a; color: #cfd8d4; }

/* ---------- story lines */
.nar { margin: 0; max-width: 32em; font-size: 17px; line-height: 1.85; text-wrap: pretty; }
.say { display: flex; align-items: flex-start; gap: 9px; }
.say.r { flex-direction: row-reverse; }
.say.cont { margin-top: -6px; }
.badge { flex: none; width: 34px; height: 34px; border-radius: 7px; display: grid; place-items: center; font-family: var(--font-brush); font-size: 19px; color: var(--night); background: var(--rice-dim); }
.say.cont .badge { visibility: hidden; height: 0; }
.sb { display: grid; gap: 3px; justify-items: start; max-width: min(78%, 26em); }
.say.r .sb { justify-items: end; }
.who { font-family: var(--font-ui); font-size: 12px; color: var(--rice-dim); }
.bub { background: var(--night-3); padding: 9px 13px; border-radius: 4px 14px 14px 14px; font-size: 16.5px; line-height: 1.7; word-break: break-word; }
.say.r .bub { background: var(--rice); color: #13282b; border-radius: 14px 4px 14px 14px; }
.s-me .badge, .s-trio .badge { background: var(--rice); }
.s-pang .badge { background: #f0a37a; } .s-pang .who { color: #f0a37a; }
.s-dao .badge { background: var(--fu); } .s-dao .who { color: var(--fu); }
.s-zom .badge { background: var(--shiqing); } .s-zom .who { color: var(--shiqing); }
.s-zom .bub { background: #23413a; color: #e3f0e6; border: 1px solid rgba(147,178,156,.45); font-size: 18px; letter-spacing: .14em; }
.s-tie .badge { background: #8fbfe0; } .s-tie .who { color: #8fbfe0; }
.s-doc .badge { background: #d6dee0; }
.s-sun .badge { background: #c8b4f0; } .s-sun .who { color: #c8b4f0; }
.s-zhou .badge { background: #b9c4be; }
.s-girl .badge { background: #f5b9c6; } .s-girl .who { color: #f5b9c6; }
.s-liu .badge { background: #f59bbd; } .s-liu .who { color: #f59bbd; }
.s-wai .badge { background: #f7b267; } .s-wai .who { color: #f7b267; }
.s-zhao .badge, .s-jing .badge { background: #7fb6ee; } .s-zhao .who, .s-jing .who { color: #7fb6ee; }
.s-clerk .badge { background: #a8d8b0; }
.s-exp .badge { background: #d2bfae; }
.s-shifu .badge { background: #d9c79c; } .s-shifu .who { color: #d9c79c; }
.s-biao .badge { background: #e3a6d6; } .s-biao .who { color: #e3a6d6; }
.s-unk .badge { background: rgba(241,236,223,.25); color: var(--rice); }

.sys { align-self: center; max-width: 92%; text-align: center; font-family: var(--font-ui); font-size: 13.5px; line-height: 1.55; background: rgba(241,236,223,.08); border: 1px solid rgba(241,236,223,.14); padding: 6px 14px; border-radius: 16px; }
.sys b { margin-right: 6px; color: var(--fu); font-weight: 600; }
.sys.warn { background: rgba(196,50,28,.16); border-color: rgba(255,120,95,.5); color: #ffb3a3; }
.sys.warn b { color: #ff8a73; }
.dan { align-self: flex-end; font-family: var(--font-ui); font-size: 14px; color: #fff; background: rgba(0,0,0,.32); border: 1px solid rgba(255,255,255,.12); padding: 4px 12px; border-radius: 14px; }
.feed > .dan { animation: dan .5s ease-out; }
@keyframes dan { from { opacity: 0; transform: translateX(48px); } to { opacity: 1; transform: none; } }
.led { padding: 10px 16px 10px 18px; background: var(--paper); color: var(--ink); font-family: var(--font-brush); font-size: 19px; line-height: 1.8; border-left: 4px solid var(--zhusha); background-image: repeating-linear-gradient(to bottom, transparent 0 33px, rgba(196,50,28,.22) 33px 34px); box-shadow: inset 0 0 26px rgba(120,80,30,.25), 0 2px 0 rgba(0,0,0,.25); }
.led + .led { margin-top: -8px; }
.led.simp { font-family: var(--font-body); font-size: 17px; border-left-color: var(--fu); transform: rotate(-1.2deg); }
.paper { padding: 10px 14px; background: #d9d7cf; color: #2a2a28; font-size: 15px; line-height: 1.8; letter-spacing: .05em; border: 1px dashed #8d8b80; box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.stone { align-self: center; max-width: 100%; padding: 14px 18px 14px 24px; text-align: center; font-family: var(--font-brush); font-size: 26px; letter-spacing: .25em; color: #d3d8d2; background: #3b4744; border-radius: 3px; box-shadow: inset 0 0 0 2px #2a3331, inset 0 0 22px rgba(0,0,0,.65); text-shadow: 0 -1px 0 rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.18); }
.bigrow { align-self: center; max-width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; padding: 10px 0; }
.big { font-family: var(--font-brush); font-size: clamp(36px, 12.5vw, 60px); line-height: 1; color: var(--zhusha); animation: stampIn .32s cubic-bezier(.2,1.6,.4,1); }
.big .dot { font-style: normal; font-size: .45em; }
@keyframes stampIn { from { opacity: 0; transform: scale(1.8) rotate(-8deg); } to { opacity: 1; transform: none; } }
.cmt1 { align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; font-family: var(--font-ui); font-size: 14px; background: rgba(241,236,223,.08); border-radius: 18px; }
.cmt1 .av { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: rgba(241,236,223,.2); }

.actcard { align-self: center; position: relative; display: grid; justify-items: center; width: min(300px, 88%); margin: 14px 0 6px; padding: 16px 12px 18px; background: var(--fu); color: var(--zhusha); outline: 2px solid var(--zhusha); outline-offset: -7px; box-shadow: 0 12px 28px rgba(0,0,0,.4); }
.act-no { font-family: var(--font-ui); font-size: 12px; color: #6b4a10; }
.act-name { font-family: var(--font-brush); font-size: 46px; line-height: 1.15; }
.act-seal { position: absolute; right: 14px; bottom: 12px; width: 26px; height: 26px; display: grid; place-items: center; background: var(--zhusha); color: var(--fu); font-family: var(--font-brush); font-size: 16px; transform: rotate(-8deg); }

/* ---------- choices and gates */
.choice { display: grid; gap: 8px; padding: 12px; border: 1px dashed rgba(232,191,58,.7); border-radius: 10px; background: rgba(232,191,58,.06); cursor: default; }
.choice .q { margin: 0 0 2px; font-family: var(--font-ui); font-size: 13px; color: var(--fu); }
.opt { text-align: left; padding: 11px 14px; font-family: var(--font-body); font-size: 16px; background: var(--night-3); border: 1px solid rgba(232,191,58,.35); border-radius: 8px; }
.opt:hover:not(:disabled) { border-color: var(--fu); }
.opt.on { background: var(--fu); color: var(--ink); border-color: var(--fu); }
.opt:disabled:not(.on) { opacity: .45; }
.card { align-self: center; width: 100%; max-width: 360px; cursor: default; }
.gate:not(.phone) { display: grid; justify-items: center; gap: 10px; padding: 14px; text-align: center; background: var(--night-2); border: 1px dashed rgba(232,191,58,.7); border-radius: 12px; }
.gate-title { margin: 0; font-family: var(--font-ui); font-size: 13.5px; color: var(--fu); }
.gate-tip { margin: 0; min-height: 1.3em; font-family: var(--font-ui); font-size: 12.5px; color: var(--rice-dim); }
.phone .gate-tip { padding: 0 12px 10px; color: #7a817e; }
.nudge { animation: nudge .5s; }
@keyframes nudge { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* ---------- phone-style cards */
.phone { overflow: hidden; background: #f7f6f2; color: #1e2321; font-family: var(--font-ui); font-size: 14px; border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.35); }
.ph-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-size: 12.5px; color: #59625f; border-bottom: 1px solid #e7e4db; }
.ph-head .ago { margin-left: auto; color: #8a918e; }
.app-ic { flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ict, #fff); background: var(--ic, #2f7cf6); }
.ph-body { display: grid; gap: 4px; padding: 10px 12px 12px; }
.ph-body p { margin: 0; line-height: 1.55; }
.sub { font-size: 12px; color: #7a817e; }
.notify .ph-body b { font-size: 14.5px; }
.listing { display: flex; gap: 10px; }
.thumb { flex: none; width: 64px; height: 64px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-brush); font-size: 30px; color: #8a5a00; background: #efe0b0; }
.lt { font-weight: 600; }
.price { color: #d93d42; font-weight: 700; }
.shop { list-style: none; margin: 0; padding: 8px 12px 12px; display: grid; gap: 8px; }
.shop li { display: flex; align-items: center; gap: 10px; }
.shop b { margin-left: auto; color: #d93d42; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sk { flex: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; color: #59625f; background: #ece9df; }
.sk.g { background: #dfeee5; color: #2e6b4b; }
.live { display: grid; gap: 8px; padding: 12px 14px; color: #fff; font-family: var(--font-ui); background: linear-gradient(160deg, #2a1416, #120b0c); border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.4); }
.lv-top { display: flex; justify-content: space-between; font-size: 12px; color: #f3c4c4; }
.lv-dot { padding: 2px 8px; border-radius: 10px; font-weight: 700; color: #fff; background: #e5484d; }
.lv-title { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.5; }
.lv-host { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #e6caca; }
.badge-s { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-family: var(--font-brush); color: var(--night); background: #8fbfe0; }
.lic { position: relative; padding: 14px 16px 16px; color: var(--ink); background: #f3ead2; border: 2px solid #b8893a; border-radius: 6px; font-family: var(--font-body); }
.lic-h { text-align: center; font-family: var(--font-brush); font-size: 26px; letter-spacing: .2em; color: #8a1f12; }
.lic-h small { display: block; letter-spacing: 0; font-family: var(--font-ui); font-size: 11px; color: #8a6a3a; }
.lic dl, .kv, .poster dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 10px 0 0; }
.lic dt { font-size: 13px; color: #8a6a3a; }
.lic dd { margin: 0; font-size: 15px; padding-right: 40px; }
.lic-seal { position: absolute; right: 14px; bottom: 12px; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-brush); font-size: 22px; color: var(--zhusha); border: 2px solid var(--zhusha); transform: rotate(-12deg); opacity: .85; }
.qrwrap { display: flex; align-items: center; gap: 12px; }
.qr { flex: none; width: 96px; height: 96px; image-rendering: pixelated; }
.kv { margin: 0; }
.kv dt { font-size: 12px; color: #7a817e; }
.kv dd { margin: 0; font-size: 13.5px; font-weight: 600; }
.kv dd small { display: block; font-size: 11.5px; font-weight: 400; color: #7a817e; }
.bill { padding: 16px; text-align: center; color: #f3e3b0; background: #0f3b2e; border: 3px solid #c9a646; border-radius: 4px; box-shadow: 0 10px 28px rgba(0,0,0,.4); }
.bill-brand { font-family: var(--font-brush); font-size: 34px; letter-spacing: .15em; color: #e9c86a; }
.bill p { margin: 6px 0 0; font-size: 16px; letter-spacing: .1em; }
.incense { max-width: 200px; display: grid; justify-items: center; gap: 4px; padding: 10px 0; }
.sticks { height: 120px; display: flex; align-items: flex-end; gap: 22px; }
.sticks i { position: relative; width: 4px; height: var(--h); border-radius: 2px; background: linear-gradient(#8a4b2a, #5b3220); }
.sticks i::before { content: ""; position: absolute; top: -4px; left: -2px; width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(#ffd27a, #ff7a2a 55%, transparent 70%); }
.censer { width: 120px; height: 26px; background: linear-gradient(#7a6a4a, #4a3f2a); border-radius: 0 0 40px 40px / 0 0 26px 26px; }
.incense p { margin: 0; font-family: var(--font-brush); font-size: 22px; color: var(--fu); }
.fu7 { display: flex; justify-content: center; gap: 6px; padding: 6px 0; }
.fu7 span { width: 32px; height: 92px; display: grid; place-items: center; font-family: var(--font-brush); font-size: 24px; color: var(--zhusha); background: var(--fu); transform: rotate(var(--r)); box-shadow: 0 6px 14px rgba(0,0,0,.35); }
.calc { overflow: hidden; padding: 12px 14px; font-family: var(--font-ui); background: #1b1f1e; border: 1px solid #333; border-radius: 12px; }
.calc-l { margin: 0; font-size: 12px; color: #8d9a96; }
.calc-n { margin: 4px 0; font-size: 28px; color: #e8f2ee; font-variant-numeric: tabular-nums; white-space: nowrap; -webkit-mask-image: linear-gradient(90deg, #000 75%, transparent); mask-image: linear-gradient(90deg, #000 75%, transparent); }
.calc-e { margin: 0; font-size: 12px; color: #ff8a73; }
.prof { display: flex; align-items: center; gap: 12px; padding: 14px 12px 10px; }
.avatar { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-brush); font-size: 24px; color: var(--night); background: var(--shiqing); }
.avatar.s { width: 30px; height: 30px; font-size: 15px; color: #59625f; background: #d8d6cf; }
.avatar.s.z { color: var(--night); background: var(--shiqing); }
.prof b { font-size: 16px; }
.latest { display: flex; align-items: center; gap: 8px; padding: 10px 12px 12px; font-size: 13.5px; border-top: 1px solid #e7e4db; }
.latest b { margin-left: auto; color: #d93d42; white-space: nowrap; }
.tag { flex: none; padding: 1px 6px; font-size: 11px; color: #fff; background: #e5484d; border-radius: 4px; }
.vids { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.vt { display: grid; gap: 4px; }
.vt span { aspect-ratio: 3 / 4; display: grid; place-items: center; font-family: var(--font-brush); font-size: 30px; color: var(--shiqing); background: linear-gradient(160deg, #2c4a43, #13282b); border-radius: 8px; }
.vt p { margin: 0; font-family: var(--font-ui); font-size: 11.5px; line-height: 1.4; }
.poster { position: relative; padding: 16px; color: var(--ink); background: var(--rice); border-radius: 4px; font-family: var(--font-body); box-shadow: 0 10px 28px rgba(0,0,0,.35); }
.po-h { min-height: 56px; margin: 0; padding-right: 64px; font-family: var(--font-brush); font-size: 26px; line-height: 1.3; color: #8a1f12; }
.poster dt { font-size: 13px; color: #7a5a3a; }

nar","x":"那天晚上十点，我们把车停在山脚下，扛着工具往山上爬。"},{"t":"nar","x":"道士走在最前面，双手捧着一个罗盘，嘴里念念有词。"},{"t":"nar","x":"走到半山腰一棵老槐树下，罗盘的指针突然疯狂地转了起来。"},{"t":"nar","x":"道士猛地停下脚步。"},{"t":"say","s":"dao","x":"就是这里！此地磁场紊乱，阴气汇聚，下面必有大墓！"},{"t":"nar","x":"我低头一看。"},{"t":"nar","x":"罗盘底下压着胖子的充电宝。"},{"t":"nar","x":"道士面不改色地把充电宝挪开。"},{"t":"nar","x":"指针还在转。"},{"t":"nar","x":"“你看，”他说，“拿开了还在转。说明不是充电宝的问题。”"},{"t":"nar","x":"后来我才知道，那个罗盘是他在夜市花十五块钱买的，本来就是坏的。"},{"t":"fx","w":"post","item":"compass"},{"t":"nar","x":"但无论如何，我们就在那棵老槐树下开工了。"},{"t":"nar","x":"开工之前，道士先在四周埋了几个捕兽夹。"},{"t":"nar","x":"“防野兽。”他说，“也防同行。”"},{"t":"nar","x":"胖子的洛阳铲，第一铲下去就断了。"},{"t":"fx","w":"post","item":"chan","v":2},{"t":"nar","x":"剩下的活，是我们用工兵铲和手干的。"},{"t":"nar","x":"所以严格来说，那天晚上我们干的事，不叫考古，也不叫盗墓。"},{"t":"nar","x":"叫刨。"},{"t":"nar","x":"我们刨了整整四个小时。胖子刨一会儿就喊饿，喊完了接着刨。"},{"t":"nar","x":"凌晨两点，我的工兵铲碰到了一块硬东西。"},{"t":"nar","x":"那天晚上，我们挖出了一口漆黑的棺材，棺材上贴着七张黄符。"},{"t":"nar","x":"道士当时面色凝重。"},{"t":"say","s":"dao","x":"此乃七星镇煞棺。"},{"t":"say","s":"me","x":"什么意思？"},{"t":"say","s":"dao","x":"意思就是，里面的东西很凶。"},{"t":"say","s":"me","x":"有多凶？"},{"t":"say","s":"dao","x":"非常凶。"},{"t":"say","s":"me","x":"值钱吗？"},{"t":"nar","x":"道士沉默了一下。"},{"t":"say","s":"dao","x":"这个得打开看看。"},{"t":"choice","id":"c_coffin","q":"要打开棺材吗？","o":[{"l":"打开","r":[{"t":"nar","x":"你很果断。"}]},{"l":"先问值不值钱","r":[{"t":"nar","x":"道士说，这个问题他刚才已经回答过了。"}]},{"l":"相信道士的专业判断","r":[{"t":"nar","x":"道士的专业判断是：打开。"}]}]},{"t":"nar","x":"棺材盖很沉，我们三个人用撬棍撬了二十分钟。"},{"t":"nar","x":"七张黄符被撬得七零八落。道士心疼地把它们一张张捡起来，夹进随身的笔记本里，说这符纸少说也有三百年了，回去能卖钱。"},{"t":"fx","w":"post","item":"fu7"},{"t":"nar","x":"我们打开棺材，里面躺着一具穿着清朝官服的男尸。"},{"t":"nar","x":"尸体保存得十分完整，脸上的皮肉甚至还有弹性。"},{"t":"nar","x":"胖子大喜。"},{"t":"say","s":"pang","x":"卧槽！古尸！这得值多少钱？"},{"t":"nar","x":"道士猛地拉住他的手。"},{"t":"say","s":"dao","x":"别碰！这是僵尸！"},{"t":"nar","x":"胖子吓得一哆嗦。"},{"t":"say","s":"me","x":"你怎么知道？"},{"t":"nar","x":"道士指着尸体额头。"},{"t":"say","s":"dao","x":"你看，它额头上有符。"},{"t":"say","s":"me","x":"这不是你刚贴上去的吗？"},{"t":"nar","x":"道士一愣。"},{"t":"say","s":"dao","x":"职业习惯。"},{"t":"nar","x":"我和道士为那张符争了起来。"},{"t":"nar","x":"胖子不知什么时候绕到了棺材另一头，蹲在那儿，低着头，不知道在摸什么。"},{"t":"nar","x":"我当时以为他在系鞋带。"},{"t":"nar","x":"就在我们争论的时候，棺材里的尸体突然睁开了眼睛。"},{"t":"nar","x":"胖子尖叫一声。"},{"t":"nar","x":"僵尸猛地坐起，一口咬在了他的脖子上。"},{"t":"fx","w":"post","shake":2,"hpd":-30,"note":"被僵尸咬了一口"},{"t":"nar","x":"那一刻，山林里响起了三个人的惨叫。"},{"t":"nar","x":"胖子是疼的。"},{"t":"nar","x":"我是吓的。"},{"t":"nar","x":"道士是因为逃跑时踩中了自己的捕兽夹。"},{"t":"nar","x":"就是他自己亲手埋的那个。"},{"t":"nar","x":"后来我们连滚带爬地跑下山。"},{"t":"nar","x":"棺材没带走。"},{"t":"nar","x":"古董没带走。"},{"t":"nar","x":"道士的鞋也没带走。"},{"t":"nar","x":"我和胖子合力掰开捕兽夹，他的脚出来了，鞋没出来。"},{"t":"nar","x":"道士当机立断，金蝉脱壳，光着一只脚跑完了下山的路。"},{"t":"nar","x":"他说，那是他新买的运动鞋，还在七天无理由退货期内。"},{"t":"fx","w":"post","ach":"shoe"},{"t":"nar","x":"只有胖子带走了一样东西。"},{"t":"nar","x":"尸毒。"},{"t":"nar","x":"回城的路上，五菱宏光开出了它这辈子最快的速度。"},{"t":"nar","x":"胖子在后座捂着脖子骂了一路。"},{"t":"nar","x":"道士坐在副驾驶，抱着他那只光脚，念了一路经。"},{"t":"nar","x":"我问他念的是什么。"},{"t":"say","s":"dao","x":"《太上老君说常清静经》。"},{"t":"say","s":"me","x":"有用吗？"},{"t":"say","s":"dao","x":"有没有用不知道。念着，没那么疼。"},{"t":"nar","x":"三天后。"},{"t":"fx","w":"post","scene":{"p":"我家","tm":"凌晨 02:17","bg":"home"}},{"t":"nar","x":"这三天里，胖子一直在发烧。"},{"t":"nar","x":"第一天，三十八度。"},{"t":"nar","x":"第二天，三十九度。"},{"t":"nar","x":"第三天，四十度。"},{"t":"fx","w":"post","hpd":-15,"note":"高烧四十度"},{"t":"nar","x":"我劝他去医院。他说挂个号要二十块，多喝热水就好了。"},{"t":"nar","x":"于是我每天下班回来——也就是夜里十一点——给他烧一壶热水。"},{"t":"nar","x":"他喝了三天热水。"},{"t":"nar","x":"体温从三十八度，喝到了四十度。"},{"t":"nar","x":"我看着沙发上的胖子，终于意识到事情的严重性。"},{"t":"say","s":"me","x":"胖子，你可能快变僵尸了。"},{"t":"nar","x":"胖子有气无力地抬起头。"},{"t":"say","s":"pang","x":"滚，我是发烧了。"},{"t":"say","s":"me","x":"不，你听我说。僵尸中毒的症状，就是脸色发青，身体发冷，神志不清。"},{"t":"say","s":"pang","x":"我这叫感冒。"},{"t":"say","s":"me","x":"那你为什么脖子上有牙印？"},{"t":"say","s":"pang","x":"你他妈不是看见了吗！"},{"t":"say","s":"me","x":"那你为什么怕光？"},{"t":"say","s":"pang","x":"我头疼！"},{"t":"say","s":"me","x":"那你嗓子里为什么一直‘嗬嗬’的？"},{"t":"say","s":"pang","x":"我扁桃体发炎！"},{"t":"say","s":"me","x":"那你指甲为什么这么长？"},{"t":"say","s":"pang","x":"我一个月没剪了！关你屁事！"},{"t":"say","s":"me","x":"那你为 ":"过了一会儿，陈守财从袖子里摸出一本巴掌大的小册子，双手递给道长。"},{"t":"nar","x":"像是在交一份工作汇报。"},{"t":"say","s":"zom","x":"这……是……近……日……的……"},{"t":"nar","x":"小册子的封皮上写着两个字：流水。"},{"t":"fx","w":"post","item":"ledger"},{"t":"nar","x":"道长翻开，借着手电的光念了起来。"},{"t":"led","x":"守库第十一万六千八百六十九日。夜，有贼三人掘地，启余门户。一贼贴符于余额上。"},{"t":"nar","x":"道长咳嗽了一声。"},{"t":"led","x":"一胖贼探手入棺，取镇魂玉。余啮之。"},{"t":"nar","x":"胖子摸了摸脖子上的纱布。"},{"t":"led","x":"三贼遁走，其一足陷铁夹，号叫甚哀，遗履一只。余追之，贼乘铁车，其疾如风，余不能及。归，掩门，歇息。"},{"t":"nar","x":"掩门。"},{"t":"nar","x":"我终于知道，那口棺材的盖子是谁合上的了。"},{"t":"led","x":"守库第十一万六千八百七十二日。夜，余巡山归，见一人对一发光小镜高呼‘家人们’，且踢余门。余拍其肩，欲告之勿踢。其人大骇，弃镜而走。"},{"t":"led","x":"镜中有字，自下而上，飞过不绝，皆曰‘主播后面有人’。"},{"t":"led","x":"余即人也。"},{"t":"fx","w":"post","ach":"yu"},{"t":"led","x":"余以指触镜，镜中忽现一铺，售手电、喷雾、护身符。不解。"},{"t":"led","x":"守库第十一万六千八百七十三日。玉气渐远，余循之入城。城中车皆铁铸，不驾马而自行，其声如雷。路远，行一日一夜。"},{"t":"led","x":"守库第十一万六千八百七十四日。玉气止于一地窖，窖中停铁车数百。贼已去，余候之。"},{"t":"led","x":"入夜，欲出窖，一老卒拦余索钱。余予以康熙通宝，不受。又示余一方块，曰‘扫码’。余触之，不应。"},{"t":"led","x":"贼三人复至。道人又贴符于余额上。余见窖中铁车，额上多贴纸条，以为此地风俗，遂从之。"},{"t":"nar","x":"道长的表情有点复杂。"},{"t":"led","x":"胖贼身上玉气甚浓，余追之。贼入梯道。余见一铁屋，人入其中，门合，复开，已至他层。妙甚。余亦入之。有妇人抱子，余让其先。"},{"t":"led","x":"贼匿一小室，以朱砂涂门。余叩之，不应。余不敢擅入。"},{"t":"nar","x":"道长一直以为，是他那道朱砂符挡住了僵尸。"},{"t":"nar","x":"原来人家只是不好意思硬闯。"},{"t":"led","x":"天将晓，楼下乐声大作。妇人数十，列队而舞。其舞也，双臂前伸，蹦跳而行，与余无异。一妇招余，余从之。"},{"t":"led","x":"妇赞余曰：‘后排新来的，动作标准。’"},{"t":"nar","x":"道长念到这里，停了一下。"},{"t":"nar","x":"下一行，只有一句话。"},{"t":"led","x":"三百二十年，未尝有人赞余。"},{"t":"gate","k":"praise","id":"g_praise"},{"t":"nar","x":"墓室里很安静。"},{"t":"nar","x":"长明灯的火苗，轻轻晃了一下。"},{"t":"nar","x":"道长清了清嗓子，接着往下念。"},{"t":"led","x":"日将出，余避于铁车之下。车行，余随之。车甚颠。"},{"t":"nar","x":"我想起这两天，车底一路“咚、咚”的声音。"},{"t":"nar","x":"我一直以为，是底盘松了。"},{"t":"led","x":"铁车停于陋巷，凡两日。贼居楼上，余不敢擅入。有猫数只，与余对视良久。"},{"t":"led","x":"复行，至山。贼入库，跪于宝前。余随之。"},{"t":"led","x":"一贼诵经。余观其镜，镜中有字，曰‘满三十减八’。不解。"},{"t":"led","x":"忽觉腹饥。三百二十年，未尝知饥。今日方知。"},{"t":"led","x":"一贼以糯米饭饲余。烫。"},{"t":"led","x":"一贼以黑水一瓶饲余。其色如墨，其味甚甘，其气冲鼻，饮之，喉中大快。"},{"t":"led","x":"今日记。"},{"t":"nar","x":"最后几行字，墨迹还没干。"},{"t":"nar","x":"原来它刚才蹲在地上，一只手缩在袖子里 。"},{"t":"nar","x":"他走到书架前，抽出最新的一本总账，翻到最后一页，从袖子里摸出一支秃了毛的毛笔，舔了舔笔尖，写了很久。"},{"t":"nar","x":"写完，他把账本递给我，指了指末尾的空白处。"},{"t":"nar","x":"那是一份交接清单。"},{"t":"nar","x":"黄金一千三百二十七锭。白银四千零八锭。玉器三百一十二件。瓷器九十六件。铜钱八十二万六千四百文。"},{"t":"nar","x":"最底下一行：交接人，陈守财。接收人，空着。"},{"t":"nar","x":"他又指了指那片空白。"},{"t":"nar","x":"我明白了。"},{"t":"nar","x":"他要我签字。"},{"t":"gate","k":"sign","id":"g_sign"},{"t":"nar","x":"我签了。"},{"t":"nar","x":"道长签了。"},{"t":"nar","x":"胖子也签了。签完，顺手把一锭金子往兜里塞。"},{"t":"nar","x":"陈守财的脑袋“咔”地一声转了过来。"},{"t":"say","s":"zom","x":"放……下……"},{"t":"nar","x":"三百二十年的老账房，眼睛比监控还毒。"},{"t":"nar","x":"胖子乖乖放了回去。"},{"t":"nar","x":"陈守财在清单最后，又慢慢写下一行字。"},{"t":"nar","x":"前面三百二十年的账，用的都是繁体字。"},{"t":"nar","x":"这一行，用的是简体。"},{"t":"nar","x":"是他这几天，在那个主播的手机上学的。"},{"t":"led","x":"交接完毕。从此下班。陈守财。","v":"simp"},{"t":"nar","x":"他看了一眼身后堆积如山的金银珠宝。"},{"t":"nar","x":"然后看了一眼我们。"},{"t":"nar","x":"突然，他笑了。"},{"t":"nar","x":"那是一种极其僵硬、极其恐怖的笑容。"},{"t":"nar","x":"两颗黑黄的獠牙露在嘴外。"},{"t":"nar","x":"胖子吓得缩到我身后。"},{"t":"nar","x":"但我知道。"},{"t":"nar","x":"那是一个终于下班的人，发自内心的笑容。"},{"t":"fx","w":"post","ach":"offwork"},{"t":"nar","x":"他朝我们深深鞠了一躬。"},{"t":"nar","x":"然后一步一步，走出了古墓。"},{"t":"nar","x":"消失在黎明前的山雾里。"},{"t":"nar","x":"我这才反应过来。"},{"t":"nar","x":"他是走出去的。"},{"t":"nar","x":"一步一步，没有跳。"},{"t":"nar","x":"道长说，僵尸之所以跳，是因为尸僵，关节打不了弯。"},{"t":"nar","x":"我觉得不是。"},{"t":"nar","x":"我觉得他就是值班值太久了，腿麻了。"},{"t":"nar","x":"三百二十年，换谁都得腿麻。"},{"t":"nar","x":"现在下班了，腿也就好了。"},{"t":"nar","x":"我们三人站在宝库前。"},{"t":"nar","x":"面面相觑。"},{"t":"nar","x":"胖子率先开口。"},{"t":"say","s":"pang","x":"所以现在这些东西……"},{"t":"nar","x":"道长说："},{"t":"say","s":"dao","x":"理论上，是无主之物。"},{"t":"nar","x":"我说："},{"t":"say","s":"me","x":"法律上，它们是国家文物。"},{"t":"nar","x":"地底下挖出来的文物，都归国家。这一条，我在普法短视频里刷到过不下十次。"},{"t":"nar","x":"三人陷入了沉默。"},{"t":"nar","x":"片刻后。"},{"t":"nar","x":"胖子缓缓拿出手机。"},{"t":"say","s":"pang","x":"那……要不报警？"},{"t":"nar","x":"道长叹了口气，没有说话。"},{"t":"nar","x":"我说："},{"t":"say","s":"me","x":"那咱们盗墓的事情怎么办？"},{"t":"nar","x":"道长看向我。"},{"t":"say","s":"dao","x":"你觉得公安机关会相信我们是来给一具僵尸办离职手续的吗？"},{"t":"nar","x":"我   resetView(); D = freshDerived();
  const atAct = !!(N[target] && N[target].t === 'act');
  const from = atAct ? target : CH[chapterAt(Math.max(0, target - 1))].i;
  for (let k = 0; k < target; k++) {
    const n = N[k];
    if (n.t === 'fx') { applyFx(n, false); continue; }
    if (n.t === 'choice' && S.picks[n.id] == null) S.picks[n.id] = 0;
    if (n.t === 'gate') S.gates[n.id] = 1;
    if (k >= from) showNode(n, k, false);
    else if (n.t === 'act') { const c = CH.findIndex(x => x.i === k); if (c >= 0) D.chap = c; }
  }
  S.i = target;
  chapterLabel(chapterAt(atAct ? target : Math.max(0, target - 1)));
  paintScene(); paintHud(); progress(); syncCtrl();
  if (target < N.length && (N[target].t === 'choice' || N[target].t === 'gate')) showNode(N[target], target, true);
  scrollEnd();
}
function showGame() { $('#title').hidden = true; inGame = true; }
function showTitle() { auto = false; clearTimeout(autoTimer); closeSheet(); inGame = false; refreshTitle(); $('#title').hidden = false; syncCtrl(); }
function newGame() {
  S = freshRun(); D = freshDerived(); resetView(); auto = false;
  paintScene(); paintHud(); progress(); closeSheet(); showGame(); step();
}
function resume() {
  const saved = load();
  if (!saved || !saved.run) { newGame(); return; }
  S = saved.run; S.picks = S.picks || {}; S.gates = S.gates || {};
  closeSheet(); showGame(); rebuild(Math.min(S.i, N.length));
}
function jump(ci) {
  const t = CH[ci].i;
  for (let k = t; k < N.length; k++) { const n = N[k]; if (n.t === 'choice') delete S.picks[n.id]; if (n.t === 'gate') delete S.gates[n.id]; }
  closeSheet(); showGame(); rebuild(t); step();
}

/* ---------- title and menu */
function refreshTitle() {
  const saved = load(), run = saved && saved.run, rb = $('#resumeBtn');
  if (run && run.i > 0 && run.i < N.length) { const c = CH[chapterAt(run.i)]; rb.hidden = false; rb.textContent = `继续营业：${c.n} ${c.name}`; } else rb.hidden = true;
  $('#wallBtn').textContent = `成就墙 ${ACHL.filter(a => ACHV[a.id]).length}/${ACHL.length}`;
}
function openSheet(tab) { renderPanes(); setTab(tab || 'chap'); $('#sheet').hidden = false; $('#closeSheet').focus({ preventScroll: true }); }
function closeSheet() { $('#sheet').hidden = true; }
function setTab(tab) {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false'));
  ['chap', 'items', 'ach'].forEach(t => { $('#pane-' + t).hidden = t !== tab; });
}
function renderPanes() {
  const pc = $('#pane-chap');
  pc.innerHTML = `<p class="count">读到哪一章，就能从哪一章重读。重读会重新问你选项。</p><div class="chaps">${CH.map((c, k) => {
    const open = k <= maxChap, cur = inGame && k === D.chap;
    return `<button type="button" class="chaprow" data-c="${k}" ${open ? '' : 'disabled'}><span>${esc(c.n)}</span><b>${open ? esc(c.name) : '？？？'}</b><span class="st">${cur ? '正在读' : open ? '重读' : '未解锁'}</span></button>`;
  }).join('')}</div>`;
  pc.querySelectorAll('.chaprow').forEach(b => b.addEventListener('click', () => jump(+b.dataset.c)));
  const ids = Object.keys(D.items);
  $('#pane-items').innerHTML = `<p class="count">已收集 ${ids.length}/${Object.keys(ITEMS).length}</p>` + (ids.length
    ? `<div class="items">${ids.map(id => { const it = ITEMS[id][D.items[id] - 1]; return `<div class="irow"><b>${esc(it.n)}</b><p>${esc(it.d)}</p></div>`; }).join('')}</div>`
    : '<p class="count">还没有道具。开始营业以后，捡到的东西会放在这里。</p>');
  const got = ACHL.filter(a => ACHV[a.id]).length;
  $('#pane-ach').innerHTML = `<p class="count">已解锁 ${got}/${ACHL.length}，其中有三个是隐藏成就，要选对选项才会出现。</p><div class="wall">${ACHL.map(a => ACHV[a.id]
    ? `<div class="wcell">${seal(a.seal)}<b>${esc(a.n)}</b><p>${esc(a.d)}</p></div>`
    : `<div class="wcell">${seal('？', 'locked')}<b>${a.h ? '隐藏成就' : '？？？'}</b><p>${a.h ? '和某个选项有关' : '读下去就知道'}</p></div>`).join('')}</div>`;
}

/* ---------- input */
feed.addEventListener('click', e => { if (e.target.closest('[data-noadv], button, a, input')) return; step(); });
$('#nextBtn').addEventListener('click', () => step());
$('#autoBtn').addEventListener('click', () => { auto = !auto; syncCtrl(); if (auto) { if (typing) return; step(); } else clearTimeout(autoTimer); });
$('#skipBtn').addEventListener('click', () => { auto = false; clearTimeout(autoTimer); skip(); });
$('#menuBtn').addEventListener('click', () => openSheet('chap'));
$('#closeSheet').addEventListener('click', closeSheet);
$('#toTitle').addEventListener('click', showTitle);
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#startBtn').addEventListener('click', newGame);
$('#resumeBtn').addEventListener('click', resume);
$('#wallBtn').addEventListener('click', () => openSheet('ach'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) { closeSheet(); return; }
  if (!inGame || !$('#sheet').hidden) return;
  if (e.target.closest && e.target.closest('button, input, textarea')) return;
  if ([' ', 'Enter', 'ArrowDown', 'ArrowRight'].includes(e.key)) { e.preventDefault(); step(); }
});

/* ---------- test hook: plays the whole story with default choices */
window.__nmTest = {
  run(limit = 30000) {
    TEST = true; const errs = []; let c = 0;
    try {
      if (!inGame) newGame();
      while (S.i < N.length && c < limit) {
        c++;
        if (typing) finishTyping();
        if (blocked !== null) {
          if (!activeGate || !activeGate.resolve) { errs.push('no resolver at node ' + blocked); break; }
          activeGate.resolve(); continue;
        }
        step(false);
      }
    } catch (e) { errs.push(String((e && e.stack) || e)); }
    TEST = false;
    return { i: S.i, len: N.length, steps: c, blocked, feed: feed.children.length, ach: ACHL.filter(a => ACHV[a.id]).length, items: Object.keys(D.items).length, hp: D.hp, hb: D.hb, errs };
  },
  jump, resume, rebuild: t => rebuild(t), state: () => ({ i: S.i, chap: D.chap, maxChap }),
};

/* ---------- boot */
function start(hot) {
  const saved = hot && hot.run ? hot : load();
  if (saved) { ACHV = saved.ach || {}; maxChap = saved.maxChap == null ? -1 : saved.maxChap; }
  $('#tTags').innerHTML = DATA.tags.map(t => `<li>${esc(t)}</li>`).join('');
  $('#tEpi').textContent = DATA.epigraph;
  refreshTitle(); syncCtrl();
  if (hot && hot.view === 'game' && hot.run) { S = hot.run; S.picks = S.picks || {}; S.gates = S.gates || {}; showGame(); rebuild(Math.min(S.i, N.length)); }
}
if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
  window.claude.hot.snapshot(() => ({ run: S, ach: ACHV, maxChap, view: inGame ? 'game' : 'title' }));
}
if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
